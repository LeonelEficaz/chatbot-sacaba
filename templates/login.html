<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gobierno Autónomo Municipal de Sacaba</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-sacaba.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-2: #15803d;
            --ink: #0f172a;
            --muted: #64748b;
            --bg: #f8fafc;
            --border: rgba(15, 23, 42, 0.08);
            --danger: #b91c1c;
            --danger-bg: #fef2f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 0%, rgba(22, 163, 74, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(20, 184, 166, 0.10) 0%, transparent 45%),
                var(--bg);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.18);
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-mark {
            width: 56px; height: 56px; margin: 0 auto 14px;
            display: grid; place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
            color: #fff; font-size: 24px; font-weight: 800;
        }
        h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
        .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.5; }
        .alert {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(185, 28, 28, 0.18);
        }
        label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 700; color: #334155; }
        input {
            width: 100%;
            padding: 12px 14px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15); }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px 16px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: transform .15s, filter .2s;
        }
        button:hover { filter: brightness(1.06); }
        button:active { transform: translateY(1px); }
        .foot { margin-top: 22px; text-align: center; font-size: 13px; }
        .foot a { color: var(--primary-2); font-weight: 600; text-decoration: none; }
        .foot a:hover { text-decoration: underline; }
        .ver {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px;
            color: #475569;
            border: none;
            background: none;
            font-size: 16px;
            line-height: 0;
            cursor: pointer;
            border-radius: 8px;
        }
        .ver:hover { background: #f1f5f9; }
        .ver svg { display: block; }
        .ver svg[hidden] { display: none; }
        .caps { margin-top: 8px; font-size: 12px; font-weight: 600; color: #b45309; }
        .nota-rol { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="brand-mark">S</div>
            <h1>Iniciar sesión</h1>
            <p class="subtitle">Panel administrativo del Portal de Trámites<br>Gobierno Autónomo Municipal de Sacaba</p>
        </div>

        {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}" novalidate>
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" value="{{ usuario }}" autocomplete="username" autofocus>

            <label for="password">Contraseña</label>
            <div style="position:relative">
                <input id="password" name="password" type="password" autocomplete="current-password">
                <button type="button" class="ver" id="verClave" aria-label="Mostrar contraseña" aria-pressed="false">
                    <svg id="ojoVer" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.2 1.5 12c1.2 2.8 5 7 10.5 7s9.3-4.2 10.5-7C21.3 9.2 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
                    <svg id="ojoOcultar" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" hidden><path fill="currentColor" d="M3.3 4.7 4.7 3.3l16 16-1.4 1.4-2.7-2.7A11 11 0 0 1 12 19C6.5 19 2.7 14.8 1.5 12a14 14 0 0 1 4.6-5.1L3.3 4.7zm4.2 4.2A12 12 0 0 0 3.7 12c1.1 2.4 4.4 6 8.3 6 1.5 0 2.9-.5 4.2-1.3l-1.7-1.7A4 4 0 0 1 9.2 10.5L7.5 8.9zm10.9-1.8 1.6 1.7c1.6 1.4 2.6 2.8 3 3.2-1.2 2.8-5 7-10.5 7-.6 0-1.2 0-1.8-.1l-2-2A10 10 0 0 0 12 17.5c1.8 0 3.5-.5 5-1.4A13.7 13.7 0 0 1 20.3 12C19.3 9.8 16.5 6.5 13 6.1L11.6 4.7c.1 0 .3 0 .4 0 5.5 0 9.3 4.2 10.5 7 .4.9-.7 1.9-1.6 3.1l-2.5-2.6 1-1.1z"/></svg>
                </button>
            </div>
            <p class="caps" id="capsAviso" hidden>Mayúsculas activadas</p>

            <button type="submit">Ingresar</button>
        </form>

        <p class="foot"><a href="{{ url_for('index') }}">Volver al portal ciudadano</a></p>
        <p class="nota-rol">Acceso exclusivo para funcionarios municipales autorizados.</p>

        <script>
            (function () {
                var campo = document.getElementById('password');
                var boton = document.getElementById('verClave');
                var aviso = document.getElementById('capsAviso');
                boton.addEventListener('click', function () {
                    var mostrar = campo.type === 'password';
                    campo.type = mostrar ? 'text' : 'password';
                    boton.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
                    boton.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
                    document.getElementById('ojoVer').hidden = mostrar;
                    document.getElementById('ojoOcultar').hidden = !mostrar;
                    campo.focus();
                });
                campo.addEventListener('keyup', function (e) {
                    aviso.hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
                });
            })();
        </script>
    </main>
</body>
</html>
