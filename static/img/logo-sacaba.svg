<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Gobierno Autonomo Municipal de Sacaba">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0b5d2e"/>
    </linearGradient>
  </defs>

  <!-- Insignia redondeada verde -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#g)"/>

  <!-- Casita simple blanca -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Techo -->
    <path d="M34 60 L64 34 L94 60"/>
    <!-- Cuerpo -->
    <rect x="42" y="58" width="44" height="38" rx="3"/>
    <!-- Puerta -->
    <rect x="59" y="74" width="10" height="22" rx="2"/>
    <!-- Ventanas -->
    <rect x="47" y="63" width="9" height="8" rx="1.5"/>
    <rect x="72" y="63" width="9" height="8" rx="1.5"/>
  </g>
</svg>
